name: Build & Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/salespilot

# 连续提交时一次只跑一条发布：后一次排队等前一次部署完，不会两次部署交叉执行
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # 上线门槛：测试不过不构建、不部署
  test-core:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://crm:crm@localhost:5432/crm
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      # 需要数据库的用例连不上库时会 skip：先确认库可用，避免「全绿但其实没测」
      - run: uv run python -c "from app.common.db import check_db; import sys; sys.exit(0 if check_db() else 1)"
      - run: uv run pytest -q

  test-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run pytest -q

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test

  build-and-push:
    needs: [test-core, test-gateway, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            image_name: salespilot-web
            build_args: |
              CORE_INTERNAL_URL=http://core:8000
          - name: core
            context: ./services/core
            dockerfile: ./services/core/Dockerfile
            image_name: salespilot-core
            build_args: ""
          - name: gateway
            context: ./services/gateway
            dockerfile: ./services/gateway/Dockerfile
            image_name: salespilot-gateway
            build_args: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image_name }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Lowercase repository owner
        id: prep
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REG_USER: ${{ github.actor }}
          REG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMG: ghcr.io/${{ steps.prep.outputs.owner_lc }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          envs: REG_USER,REG_TOKEN,IMG,SHA
          # 阿里云服务器从 ghcr 拉镜像较慢（core 首次约 9 分钟），默认 10 分钟会超时
          command_timeout: 40m
          # 任何一步失败就让流水线失败：原来 `pull || true` 把拉镜像失败吞掉，服务器一直跑旧镜像却显示部署成功
          script: |
            set -e
            cd /srv/salespilot
            # 服务器上不改入库文件（HTTPS 配置由 docker-compose.prod.yml 挂载），直接对齐远端；.env、证书不在版本库里，不受影响
            # 对齐到本次构建的提交（不是 origin/main 的最新）：compose 配置、迁移和镜像是同一个版本
            git fetch origin main
            git reset --hard "$SHA"
            # 拉本次 CI 构建的镜像（按 commit 固定版本），再打成 compose 默认用的 salespilot-*:latest：
            # 原来直接 pull salespilot-*:latest 会去 Docker Hub 镜像站找，根本不存在；打标签后手动 dc up -d 也用新镜像
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$REG_TOKEN" | docker login ghcr.io -u "$REG_USER" --password-stdin
            for s in core web gateway; do
              docker pull "$IMG/salespilot-$s:$SHA"
              docker tag "$IMG/salespilot-$s:$SHA" "salespilot-$s:latest"
            done
            dc="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $dc up -d
            # 核对每个服务实际跑的是本次镜像：曾出现 gateway 没被重建、还在跑旧镜像，部署却显示成功
            for s in core web gateway; do
              want=$(docker image inspect -f '{{.Id}}' "salespilot-$s:latest")
              have=$(docker inspect -f '{{.Image}}' "$($dc ps -q $s)")
              if [ "$want" != "$have" ]; then
                echo "$s 还在跑旧镜像，强制重建"
                $dc up -d --force-recreate --no-deps "$s"
                have=$(docker inspect -f '{{.Image}}' "$($dc ps -q $s)")
                [ "$want" = "$have" ] || { echo "$s 镜像仍不一致" >&2; exit 1; }
              fi
            done
            $dc exec -T core alembic upgrade head
            $dc ps
            # 业务就绪检查：数据库连通、会话存在 Postgres（/health status=ok），最多等 3 分钟
            ready='import json,sys,urllib.request; d=json.load(urllib.request.urlopen("http://localhost:8000/health"))["data"]; print(d); sys.exit(0 if d["status"]=="ok" else 1)'
            for i in $(seq 1 36); do
              if $dc exec -T core python -c "$ready"; then exit 0; fi
              sleep 5
            done
            echo "core 未就绪" >&2
            $dc logs --tail 100 core
            exit 1
