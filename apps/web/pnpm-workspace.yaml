allowBuilds:
  esbuild: true
# 使用 hoisted node_modules：Windows 未开启开发者模式时，standalone 构建无法创建 symlink
# （pnpm 默认的符号链接布局会导致 next build 复制追踪文件时报 EPERM）
nodeLinker: hoisted
# next 15 把自带的 postcss 锁死在 8.4.31，有已知漏洞（构建期解析 CSS 时触发）；同一大版本内统一到已修复版本。
# next 跟进后可删掉。改了 overrides 要先删 node_modules/.pnpm-workspace-state-v1.json 再 pnpm install，否则 pnpm 会误判「已是最新」不重新解析。
overrides:
  postcss: '^8.5.31'
