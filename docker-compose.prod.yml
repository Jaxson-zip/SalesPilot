# 正式上线：在 docker-compose.yml 基础上叠加
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# 与本地开发的区别：
#   - 只有 nginx 对外开放（80 / 443）；数据库、core、网关、web 只在容器内网互通，外面连不上
#   - 所有服务崩溃或服务器重启后自动拉起
#   - core 信任 nginx 写入的来源 IP（登录失败锁定按真实客户端计数）
#   - 默认正式模式（DEMO_LOGIN=false）：默认密钥 / 默认数据库密码会被 core 拒绝启动
#   - 容器日志按大小轮转（默认不限大小，会慢慢占满磁盘）
# 上线步骤和检查清单见 docs/上线部署指南.md

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  gateway:
    image: ${GATEWAY_IMAGE:-salespilot-gateway:latest}
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    healthcheck:
      timeout: 15s
      interval: 15s

  core:
    image: ${CORE_IMAGE:-salespilot-core:latest}
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      TRUST_PROXY_HEADERS: "true"
      DEMO_LOGIN: ${DEMO_LOGIN:-false}

  web:
    image: ${WEB_IMAGE:-salespilot-web:latest}
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  nginx:
    profiles: !reset []
    restart: unless-stopped
    logging: *logging
    ports: !override
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
