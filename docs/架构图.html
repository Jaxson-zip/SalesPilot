<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesPilot 架构图</title>
<style>
  :root { --bg:#f4f4f5; --card:#fff; --line:#d4d4d8; --text:#18181b; --muted:#71717a; }
  body { margin:0; background:var(--bg); font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color:var(--text); }
  .wrap { max-width:1240px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid #e4e4e7; border-radius:12px; padding:12px; }
  svg { width:100%; height:auto; display:block; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SalesPilot · AI 销售 CRM 系统架构</h1>
  <p class="sub">前端 TypeScript（Next.js）· 后端 Python（FastAPI + LangGraph）· 自写网关外壳 + LiteLLM 库 · PostgreSQL + pgvector · Docker Compose 部署</p>
  <div class="card">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SalesPilot 系统架构图">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .t  { font-size:15px; font-weight:600; fill:#18181b; }
      .s  { font-size:12px; fill:#52525b; }
      .xs { font-size:11px; fill:#71717a; }
      .tag{ font-size:11px; font-weight:600; }
      .ln { stroke:#a1a1aa; stroke-width:1.5; fill:none; }
      .lnV{ stroke:#7c3aed; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <!-- 层标签 -->
  <g class="xs" font-weight="600">
    <text x="20" y="80">展示层</text><text x="20" y="96" class="xs">TypeScript</text>
    <text x="20" y="300">服务层</text><text x="20" y="316" class="xs">Python</text>
    <text x="20" y="560">数据 / 模型层</text>
    <text x="20" y="720">外部服务</text>
  </g>

  <!-- ===== 展示层：web ===== -->
  <rect x="110" y="30" width="1070" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="130" y="56" class="t">web · Next.js 15 + React 19</text>
  <text x="130" y="74" class="xs">Tailwind · shadcn/ui · TanStack Query / Table · dnd-kit · react-hook-form + zod · lucide</text>
  <rect x="130" y="88" width="300" height="56" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <text x="146" y="112" class="s" font-weight="600" fill="#18181b">CRM 页面</text>
  <text x="146" y="130" class="xs">工作台 · 客户 · 商机看板 · 报价 · 合同 · 报销</text>
  <rect x="446" y="88" width="300" height="56" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="462" y="112" class="s" font-weight="600" fill="#5b21b6">AI 会话 / 侧栏</text>
  <text x="462" y="130" class="xs">流式正文 · 思维链步骤 · 方案卡片 · 确认卡片</text>
  <rect x="762" y="88" width="398" height="56" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <text x="778" y="112" class="s" font-weight="600" fill="#18181b">管理与审批</text>
  <text x="778" y="130" class="xs">审批中心（主管）· 行业包配置 / 产品线映射（管理员）</text>

  <!-- web → core -->
  <path d="M280 160 V214" class="ln" marker-end="url(#arr)"/>
  <text x="290" y="192" class="xs">REST /api/*（JSON）</text>
  <path d="M596 160 V214" class="lnV" marker-end="url(#arrV)"/>
  <text x="606" y="192" class="xs" fill="#7c3aed">POST + SSE /api/agent/*</text>
  <text x="900" y="192" class="xs">Nginx：/ → web　/api → core（SSE 关闭缓冲）</text>

  <!-- ===== 服务层：core ===== -->
  <rect x="110" y="220" width="1070" height="270" rx="12" fill="#ffffff" stroke="#a1a1aa"/>
  <text x="130" y="246" class="t">core · FastAPI :8000</text>
  <text x="300" y="246" class="xs">SQLAlchemy 2 · Pydantic v2 · Alembic · PyJWT · sse-starlette</text>
  <rect x="130" y="258" width="1030" height="32" rx="6" fill="#f4f4f5"/>
  <text x="146" y="279" class="s">common：JWT 鉴权 · 数据范围过滤（本人 / 团队 / 全公司）· 统一响应与错误码 · request_id</text>

  <!-- crm -->
  <rect x="130" y="304" width="240" height="170" rx="10" fill="#fff" stroke="#d4d4d8"/>
  <text x="146" y="328" class="t">crm 业务模块</text>
  <text x="146" y="350" class="s">客户 · 联系人 · 跟进</text>
  <text x="146" y="368" class="s">商机 · 报价 · 合同 · 提成</text>
  <text x="146" y="386" class="s">报销 · 审批 · 动态</text>
  <text x="146" y="414" class="xs">routers → services → models</text>
  <text x="146" y="432" class="xs">规则引擎：rules.yaml</text>
  <text x="146" y="450" class="xs">（毛利、折扣、提成、报销标准）</text>

  <!-- agent -->
  <rect x="390" y="304" width="320" height="170" rx="10" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="406" y="328" class="t" fill="#5b21b6">agent · LangGraph</text>
  <g font-size="11">
    <rect x="406" y="342" width="56" height="24" rx="5" fill="#fff" stroke="#ddd6fe"/><text x="416" y="358" class="xs">router</text>
    <rect x="474" y="342" width="62" height="24" rx="5" fill="#fff" stroke="#ddd6fe"/><text x="482" y="358" class="xs">configure</text>
    <rect x="548" y="342" width="56" height="24" rx="5" fill="#fff" stroke="#ddd6fe"/><text x="560" y="358" class="xs">price</text>
    <rect x="616" y="342" width="78" height="24" rx="5" fill="#fff" stroke="#ddd6fe"/><text x="624" y="358" class="xs">check_margin</text>
    <path d="M462 354 H472 M536 354 H546 M604 354 H614" stroke="#a78bfa" stroke-width="1.2"/>
    <path d="M655 366 V382 H505 V368" stroke="#f59e0b" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="530" y="396" class="xs" fill="#b45309">毛利不达标 → 回退重配（≤2 次）</text>
    <rect x="474" y="408" width="98" height="24" rx="5" fill="#fff" stroke="#ddd6fe"/><text x="482" y="424" class="xs">interrupt 确认</text>
    <rect x="584" y="408" width="62" height="24" rx="5" fill="#fff" stroke="#ddd6fe"/><text x="592" y="424" class="xs">respond</text>
  </g>
  <text x="406" y="452" class="xs">12 个工具 · checkpointer 存 Postgres</text>
  <text x="406" y="468" class="xs">工具进程内调用 crm service，权限一致</text>

  <!-- packs -->
  <rect x="730" y="304" width="200" height="170" rx="10" fill="#fff" stroke="#d4d4d8"/>
  <text x="746" y="328" class="t">packs 行业包</text>
  <text x="746" y="350" class="s">Configurator 接口</text>
  <rect x="746" y="364" width="168" height="26" rx="5" fill="#f4f4f5"/><text x="756" y="381" class="xs">llm_deploy 大模型部署</text>
  <rect x="746" y="396" width="168" height="26" rx="5" fill="#f4f4f5"/><text x="756" y="413" class="xs">it_office 企业办公 IT</text>
  <text x="746" y="444" class="xs">catalog · rules · knowledge</text>
  <text x="746" y="462" class="xs">按商机产品线自动选择</text>

  <!-- rag -->
  <rect x="950" y="304" width="210" height="170" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="966" y="328" class="t" fill="#1e40af">rag 知识库</text>
  <text x="966" y="350" class="s">加载 → 切块 800/120</text>
  <text x="966" y="368" class="s">→ Embedding → 入库</text>
  <text x="966" y="386" class="s">检索 top8 → 阈值 → 重排</text>
  <text x="966" y="414" class="xs">分区：公司制度 / 行业包</text>
  <text x="966" y="432" class="xs">回答必带出处</text>
  <text x="966" y="450" class="xs">无命中 → 明确拒答</text>

  <!-- 模块之间 -->
  <path d="M390 390 H372" class="ln" marker-end="url(#arr)"/>
  <path d="M710 390 H728" class="ln" marker-end="url(#arr)"/>
  <path d="M700 474 V482 H1055 V476" class="ln" marker-end="url(#arr)"/>
  <text x="820" y="482" class="xs" dy="-3">search_policy</text>

  <!-- ===== 数据 / 模型层 ===== -->
  <!-- DB -->
  <rect x="110" y="530" width="420" height="140" rx="12" fill="#fff" stroke="#a1a1aa"/>
  <text x="130" y="556" class="t">PostgreSQL 16 + pgvector :5432</text>
  <rect x="130" y="570" width="122" height="84" rx="8" fill="#f4f4f5"/>
  <text x="142" y="594" class="s" font-weight="600" fill="#18181b">业务表</text>
  <text x="142" y="612" class="xs">客户 / 商机 / 报价</text><text x="142" y="628" class="xs">报销 / 审批 / 动态</text><text x="142" y="644" class="xs">金额以「分」存储</text>
  <rect x="262" y="570" width="122" height="84" rx="8" fill="#eff6ff"/>
  <text x="274" y="594" class="s" font-weight="600" fill="#1e40af">kb_chunks</text>
  <text x="274" y="612" class="xs">vector(N) · HNSW</text><text x="274" y="628" class="xs">scope / 文档 / 章节</text><text x="274" y="644" class="xs">内容哈希去重</text>
  <rect x="394" y="570" width="122" height="84" rx="8" fill="#faf5ff"/>
  <text x="406" y="594" class="s" font-weight="600" fill="#5b21b6">会话状态</text>
  <text x="406" y="612" class="xs">LangGraph</text><text x="406" y="628" class="xs">checkpointer</text><text x="406" y="644" class="xs">中断后可继续</text>
  <path d="M250 490 V528" class="ln" marker-end="url(#arr)"/><text x="258" y="514" class="xs">SQL</text>

  <!-- gateway -->
  <rect x="570" y="530" width="370" height="140" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="590" y="556" class="t" fill="#5b21b6">gateway :8100 · FastAPI + LiteLLM 库</text>
  <text x="590" y="578" class="s">models.yaml 注册表：别名 · 能力 · 分组</text>
  <text x="590" y="600" class="xs">兼容层：请求规范化 → Router → 响应 / 流式规范化</text>
  <text x="590" y="618" class="xs">补 tool id · 修 JSON · 统一 finish_reason · 伪流式</text>
  <text x="590" y="640" class="xs">双链路：openai_compat ｜ native（LiteLLM 原生适配）</text>
  <text x="590" y="658" class="xs">首字节前失败切换 · 契约测试 · 调用日志</text>
  <path d="M550 474 V500 H755 V528" class="lnV" marker-end="url(#arrV)"/>
  <text x="640" y="496" class="xs" fill="#7c3aed">chat / embeddings</text>

  <!-- storage -->
  <rect x="980" y="530" width="200" height="140" rx="12" fill="#fff" stroke="#d4d4d8"/>
  <text x="1000" y="556" class="t">文件与知识源</text>
  <text x="1000" y="580" class="s">/data/uploads</text>
  <text x="1000" y="598" class="xs">发票、小票附件（Docker 卷）</text>
  <text x="1000" y="624" class="s">knowledge/*.md|pdf|xlsx</text>
  <text x="1000" y="642" class="xs">制度、部署规范、产品手册</text>
  <text x="1000" y="658" class="xs">→ ingest 入库</text>

  <!-- ===== 外部：模型 ===== -->
  <g>
    <rect x="570" y="700" width="112" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="590" y="725" class="s" font-weight="600" fill="#18181b">腾讯混元</text><text x="590" y="743" class="xs">chat · embedding</text>
    <rect x="699" y="700" width="112" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="719" y="725" class="s" font-weight="600" fill="#18181b">DeepSeek</text><text x="719" y="743" class="xs">chat · 工具调用</text>
    <rect x="828" y="700" width="112" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="848" y="725" class="s" font-weight="600" fill="#18181b">通义 Qwen</text><text x="848" y="743" class="xs">chat · embedding</text>
    <path d="M626 670 V698 M755 670 V698 M884 670 V698" class="lnV" marker-end="url(#arrV)"/>
    <text x="570" y="778" class="xs" fill="#7c3aed">… 接入更多模型（Kimi、智谱、Claude、本地 vLLM 等）只改 models.yaml，不改代码</text>
  </g>

  <!-- 部署说明 -->
  <rect x="110" y="700" width="420" height="56" rx="10" fill="#fafafa" stroke="#e4e4e7" stroke-dasharray="4 3"/>
  <text x="126" y="724" class="s" font-weight="600" fill="#18181b">部署：Docker Compose（web · core · gateway · db）</text>
  <text x="126" y="744" class="xs">云端：腾讯云轻量服务器 + Nginx；gateway 和 db 只在内网暴露</text>

  <!-- 图例 -->
  <g transform="translate(980,700)">
    <line x1="0" y1="14" x2="26" y2="14" class="ln"/><text x="32" y="18" class="xs">普通调用</text>
    <line x1="0" y1="40" x2="26" y2="40" class="lnV"/><text x="32" y="44" class="xs">AI / 模型相关</text>
  </g>
</svg>
  </div>
</div>
</body>
</html>
