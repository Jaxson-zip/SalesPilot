# 反向代理：/ → web，/api → core（架构设计 §8）
# 启用：docker compose --profile prod up -d（本地默认端口 8080，云端把 NGINX_PORT 设为 80）

# 静态文件本地缓存（见 snippets/salespilot.conf 的 /_next/static/）：保留旧版本 chunk，发布后旧页面不白屏
proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:10m max_size=1g inactive=60d use_temp_path=off;

# 请求 ID：客户端带了 X-Request-ID 就透传，没带才用 nginx 生成的（AGENTS 第 9 条）
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# WebSocket / HMR 才需要 Upgrade，普通请求保持 keep-alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/salespilot.conf;
}
