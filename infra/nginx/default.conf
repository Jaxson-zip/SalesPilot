# 反向代理：/ → web，/api → core（架构设计 §8）
# 启用：docker compose --profile prod up -d（本地默认端口 8080，云端把 NGINX_PORT 设为 80）

# 请求 ID：客户端带了 X-Request-ID 就透传，没带才用 nginx 生成的（AGENTS 第 9 条）
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# WebSocket / HMR 才需要 Upgrade，普通请求保持 keep-alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;          # 报销附件（发票、小票），单个 ≤ 10 MB

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $req_id;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location /api/agent/ {
        # SSE：关闭缓冲，否则流式输出会被攒成一整块才发给浏览器
        proxy_pass http://core:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://core:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
