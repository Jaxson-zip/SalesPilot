# HTTPS 版本（正式上线用）：docker-compose.prod.yml 把它挂成 nginx 的 default.conf，服务器上不用改任何入库文件。
# 证书放到服务器的 infra/nginx/certs/fullchain.pem 和 privkey.pem（云厂商免费证书选「Nginx」格式下载），见 docs/上线部署指南.md。
# 本地 docker compose --profile prod 用的是只有 HTTP 的 default.conf（本地没有证书）。

# 静态文件本地缓存（见 snippets/salespilot.conf 的 /_next/static/）：保留旧版本 chunk，发布后旧页面不白屏
proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:10m max_size=1g inactive=60d use_temp_path=off;

# 请求 ID：客户端带了 X-Request-ID 就透传，没带才用 nginx 生成的
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# HTTP 一律跳转到 HTTPS
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # HSTS（浏览器记住只走 HTTPS）在 snippets/headers.conf 里，确认证书续期正常后再加 includeSubDomains
    include /etc/nginx/snippets/salespilot.conf;
}
