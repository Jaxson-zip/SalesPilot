# 安全响应头。每个写了 add_header 的 location 都要再 include 一次：
# nginx 的 location 里一旦有 add_header，外层的 add_header 就全部不再继承（原来静态资源响应没有这些头）。
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# 只走 HTTP 时浏览器会忽略这个头，本地 default.conf 一起带上没有影响
add_header Strict-Transport-Security "max-age=31536000" always;
# CSP：只允许本站资源。Next.js 的水合脚本和 Tailwind / Radix 的内联样式需要 'unsafe-inline'；
# 附件预览用 blob: 地址；不连任何第三方域名（模型调用都经 core → 网关，在服务端）
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# 只有语音输入要用话筒（本站）；摄像头、定位、支付等一律关闭（拍发票走文件选择，不需要摄像头权限）
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
