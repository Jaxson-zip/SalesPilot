# 每个 location 都要 include：location 里一旦写了 proxy_set_header，外层的就全部不再继承
proxy_http_version 1.1;
proxy_set_header Host $host;
# 来源 IP 用连接对端覆盖写入，不透传客户端自带的值（core 设 TRUST_PROXY_HEADERS=true 时读 X-Real-IP，
# 用于登录失败锁定；透传的话伪造请求头就能绕过）。前面还有云负载均衡时改用 real_ip 模块取真实地址
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Request-ID $req_id;
