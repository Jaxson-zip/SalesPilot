# HTTP（default.conf）和 HTTPS（https.conf.example）两个 server 共用的部分
client_max_body_size 20m;          # 报销附件（发票、小票），单个 ≤ 10 MB

server_tokens off;

# 开启 Gzip 压缩：显著降低跨洋网络传输体积，加快首屏资源加载速度
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

# 安全响应头：禁止被别的网站用 iframe 嵌入（点击劫持）、禁止浏览器猜测文件类型
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = /nginx-health {
    access_log off;
    return 200 "ok";
}

# Next.js 静态文件强缓存（带 contenthash，内容永不变化，客户端直接缓存 1 年）
location /_next/static/ {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
    proxy_cache_bypass 0;
    proxy_no_cache 0;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 静态资源图标、字体等缓存 30 天
location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location /api/agent/ {
    # SSE：关闭缓冲，否则流式输出会被攒成一整块才发给浏览器
    proxy_pass http://core:8000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
}

location /api/ {
    proxy_pass http://core:8000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
}

location / {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
