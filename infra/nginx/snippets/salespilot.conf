# HTTP（default.conf）和 HTTPS（https.conf）两个 server 共用的部分
client_max_body_size 20m;          # 报销附件（发票、小票），单个 ≤ 10 MB

server_tokens off;

# 开启 Gzip 压缩：显著降低跨洋网络传输体积，加快首屏资源加载速度
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

# 安全响应头（点击劫持、MIME 猜测、CSP、Permissions-Policy 等），见 headers.conf
include /etc/nginx/snippets/headers.conf;

location = /nginx-health {
    access_log off;
    return 200 "ok";
}

# Next.js 静态文件强缓存（带 contenthash，内容永不变化，客户端直接缓存 1 年）。
# 同时在 nginx 本地缓存一份（next_static，见 default.conf / https.conf）：发布后新 web 容器里没有旧版本的
# chunk，发布前打开、还没刷新的页面切换路由时仍能从这里拿到旧文件，不会白屏。
location /_next/static/ {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
    proxy_cache next_static;
    proxy_cache_key $uri;
    proxy_cache_valid 200 60d;
    proxy_cache_use_stale error timeout updating;
    # 新版本里没有（发布前打开的页面在要旧版本的 chunk）：到历次版本的存档里找
    proxy_intercept_errors on;
    error_page 404 = @static_archive;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
    include /etc/nginx/snippets/headers.conf;
}

# 历次发布的 /_next/static 存档（卷 static_archive，发布流水线写入）：文件名带内容 hash，不会冲突
location @static_archive {
    root /srv/static-archive;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Cache-Status ARCHIVE always;
    include /etc/nginx/snippets/headers.conf;
}

# 静态资源图标、字体等缓存 30 天
location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000" always;
    include /etc/nginx/snippets/headers.conf;
}

location /api/agent/ {
    # SSE：关闭缓冲，否则流式输出会被攒成一整块才发给浏览器
    proxy_pass http://core:8000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
}

location /api/ {
    proxy_pass http://core:8000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Connection "";
}

location / {
    proxy_pass http://web:3000;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 页面 HTML 不缓存：Next.js 给预渲染页面带的是 s-maxage=31536000，前面一旦加 CDN 会把旧页面缓存一年，
    # 发布后用户拿到的还是旧 HTML。改成每次向服务器确认（no-cache 仍可用 ETag 304，不会多传）
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/headers.conf;
}
