# 通用业务规则（开发规范 §4.1）。阈值只放这里，代码不硬编码。
# 比例用小数表示；金额单位：分。行业包的 rules.yaml 可以覆盖其中的项。

margin:
  floor_rate: 0.25            # 报价毛利底线，低于需主管审批

discount:
  max_rate: 0.10              # 销售折扣权限，超过需主管审批

commission:
  rates:                      # 按物料类别的提成比例
    hardware: 0.03
    software: 0.08
    service: 0.08
  low_margin_floor: 0.25      # 合同毛利低于该值时提成减半
  low_margin_factor: 0.5

expense:
  entertainment_per_person: 15000   # 客户招待标准：¥150/人（分）
  rule_ref: "《费用报销管理制度》4.2 招待标准"
  # 提交前必须具备的票据：客户招待要发票 + 小票，其他类型至少一张发票
  required_kinds:
    entertainment: [invoice, receipt]
    default: [invoice]
  hotel:                      # 差旅住宿：按城市分档的每晚标准（分）
    per_night: 35000          # 其他城市 ¥350/晚
    per_night_tier1: 50000    # 一线城市 ¥500/晚
    tier1_cities: [北京, 上海, 广州, 深圳]
    rule_ref: "《费用报销管理制度》3.2 住宿"

attachment:
  max_bytes: 10485760         # 单个票据 ≤ 10 MB
  allowed_types: [image/jpeg, image/png, application/pdf]

agent:
  margin_max_retries: 2       # 毛利回退最多重新配置次数
  max_tool_calls: 8

pipeline:
  # 商机阶段默认赢率（0–100）：切换阶段时自动带出，之后仍可手动修改
  stage_win_rate:
    lead: 10
    qualified: 25
    proposal: 50
    negotiation: 75
    won: 100
    lost: 0
  stale_days: 14              # 未终态商机超过 N 天没有动态 / 跟进 → 停滞提醒

quote:
  valid_days: 30              # 报价有效期：创建日 + N 天

payment:
  # 标准回款计划（《合同审批与回款流程》3.1）：合同生成时按此拆期，负责人可以调整
  # due_days = 签订后多少天到期（到货验收、质保期满的实际日期以合同为准，负责人可修改）
  schedule:
    - {name: 预付款, ratio: 0.30, due_days: 0}
    - {name: 到货验收款, ratio: 0.60, due_days: 60}
    - {name: 质保金, ratio: 0.10, due_days: 425}
  followup_days: 30           # 逾期超过 30 天：每周跟进（3.3）
  block_days: 90              # 逾期超过 90 天：暂停该客户新报价审批（3.3）
  rule_ref: "《合同审批与回款流程》3.1 标准付款方式、3.3 逾期回款"

privacy:
  # 客户数据防泄漏：联系人电话默认显示为 139****2222，点「查看」才显示完整号码并记入操作日志
  phone_reveal_daily_limit: 30   # 每人每天最多查看完整电话次数
  export_max_rows: 200           # 列表单次最多导出条数
  export_roles:                  # 各类数据允许导出的角色（销售不能导出客户 / 商机名单）
    customers: [manager, admin]
    opportunities: [manager, admin]
    quotes: [sales, manager, admin]
    contracts: [manager, admin]
    expenses: [sales, manager, admin]

meddic:
  # MEDDIC 赢单要素：进入某阶段时应该已经确认的项（没确认 → 商机上标「风险」，不阻止推进）
  # identify_pain 痛点 / metrics 量化收益 / economic_buyer 经济决策人 /
  # decision_criteria 决策标准 / decision_process 决策流程 / champion 内部支持者
  stage_required:
    qualified: [identify_pain]
    proposal: [metrics, decision_criteria]
    negotiation: [economic_buyer, decision_process, champion]
