# 通用业务规则（开发规范 §4.1）。阈值只放这里，代码不硬编码。
# 比例用小数表示；金额单位：分。行业包的 rules.yaml 可以覆盖其中的项。

margin:
  floor_rate: 0.25            # 报价毛利底线，低于需主管审批

discount:
  max_rate: 0.10              # 销售折扣权限，超过需主管审批

commission:
  rates:                      # 按物料类别的提成比例
    hardware: 0.03
    software: 0.08
    service: 0.08
  low_margin_floor: 0.25      # 合同毛利低于该值时提成减半
  low_margin_factor: 0.5

expense:
  entertainment_per_person: 15000   # 客户招待标准：¥150/人（分）
  rule_ref: "《费用报销管理制度》4.2 招待标准"
  # 提交前必须具备的票据：客户招待要发票 + 小票，其他类型至少一张发票
  required_kinds:
    entertainment: [invoice, receipt]
    default: [invoice]

attachment:
  max_bytes: 10485760         # 单个票据 ≤ 10 MB
  allowed_types: [image/jpeg, image/png, application/pdf]

agent:
  margin_max_retries: 2       # 毛利回退最多重新配置次数
  max_tool_calls: 8

pipeline:
  # 商机阶段默认赢率（0–100）：切换阶段时自动带出，之后仍可手动修改
  stage_win_rate:
    lead: 10
    qualified: 25
    proposal: 50
    negotiation: 75
    won: 100
    lost: 0
  stale_days: 14              # 未终态商机超过 N 天没有动态 / 跟进 → 停滞提醒

quote:
  valid_days: 30              # 报价有效期：创建日 + N 天
