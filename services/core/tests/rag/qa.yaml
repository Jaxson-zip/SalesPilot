# 知识库评测集（架构设计 §5.5）：问题 + 期望命中的文档和章节。
# - doc：期望出处（文档名，不含扩展名）；section：章节路径里应包含的文字（可省略）
# - pack：问题属于哪个行业包（检索范围 = 公司制度 + 该行业包）；不写只查公司制度
# - no_answer: true 表示知识库里没有答案，正确行为是拒答（found=false）
# 运行：uv run python -m app.rag.evaluate（需要配置 Embedding 模型并已入库）

