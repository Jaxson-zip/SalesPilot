# SalesPilot 模型注册表 —— 新增模型只改这个文件（AGENTS.md 硬性规则 7）
#
# - alias：对外别名，core 用它或分组名调用
# - link：openai_compat（写 api_base + api_key 即可）| native（LiteLLM 原生适配，model 写成 provider/model）
# - model：上游模型名。下面的名字都是示例占位，以各家官方文档为准
# - api_base / api_key：一律用 ${ENV} 引用环境变量，禁止写真实 Key
# - capabilities：先按文档填写，以契约测试结果为准；不通过的能力改成 false，兼容层自动降级
#   可用字段见 app/registry.py 的 Capabilities（未写的按保守默认值处理）
#
# 没有配置 Key 的模型会被标记为 unavailable：服务照常启动，分组里自动跳过。

models:
  - alias: hunyuan-turbo
    link: openai_compat
    model: hunyuan-turbo                 # 以官方文档为准
    api_base: ${HUNYUAN_API_BASE}
    api_key: ${HUNYUAN_API_KEY}
    capabilities:
      stream: true
      tools: true
      stream_tools: true
      tool_choice_required: false
      parallel_tool_calls: false
      json_mode: false
      simple_schema: true
      max_context: 32000

  - alias: deepseek-chat
    link: openai_compat
    model: deepseek-chat                 # 以官方文档为准
    api_base: ${DEEPSEEK_API_BASE}
    api_key: ${DEEPSEEK_API_KEY}
    capabilities:
      stream: true
      tools: true
      stream_tools: true
      tool_choice_required: true
      parallel_tool_calls: true
      json_mode: true
      max_context: 128000               # 契约测试实测 25.6 万 token 输入仍返回 200；保守按 128K（原写 64000 已过时）

  # native 链路示例：同一个 DeepSeek，走 LiteLLM 的原生 deepseek 适配（provider/model 写法，不用写 api_base）。
  # 用于对照两条链路的契约测试结果；不放进分组，模型选择器里可以手动指定。
  - alias: deepseek-native
    link: native
    model: deepseek/deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    capabilities:
      stream: true
      tools: true
      stream_tools: true
      tool_choice_required: true
      parallel_tool_calls: true
      json_mode: true
      max_context: 128000

  - alias: qwen-plus
    link: openai_compat
    model: qwen-plus                     # 以官方文档为准
    api_base: ${DASHSCOPE_API_BASE}
    api_key: ${DASHSCOPE_API_KEY}
    capabilities:
      stream: true
      tools: true
      stream_tools: true
      parallel_tool_calls: true
      json_mode: true
      max_context: 128000

  - alias: embed-qwen
    link: openai_compat
    model: text-embedding-v4             # 通义 Embedding，默认 1024 维；以官方文档为准
    api_base: ${DASHSCOPE_API_BASE}
    api_key: ${DASHSCOPE_API_KEY}
    capabilities:
      stream: false
      embeddings: true
      dims: 1024

  - alias: embed-default
    link: openai_compat
    model: hunyuan-embedding             # 以官方文档为准
    api_base: ${HUNYUAN_API_BASE}
    api_key: ${HUNYUAN_API_KEY}
    capabilities:
      stream: false
      embeddings: true
      dims: 1024

groups:                       # 分组 = 失败切换顺序；core 默认调用分组名
  chat-default: [hunyuan-turbo, deepseek-chat, qwen-plus]
  chat-agent: [deepseek-chat, qwen-plus, hunyuan-turbo]   # 只放 tools 能力为 true 的模型
  # Embedding 分组只放一个模型：不同模型的向量不能互相比较，失败切换会让检索结果错乱。
  # 换模型时改这里，然后清空知识库重新入库（python -m app.rag.ingest --scope all --reset）
  embed: [embed-qwen]

settings:
  timeout_seconds: 30         # 环境变量 GATEWAY_TIMEOUT_SECONDS 显式设置时以环境变量为准
  retries: 1                  # 同一模型重试次数，之后切到分组里的下一个
