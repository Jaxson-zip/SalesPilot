[project]
name = "salespilot-gateway"
version = "0.1.0"
description = "SalesPilot 模型网关：模型注册表 + 兼容层，对外 OpenAI 格式"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "litellm[mcp]==1.106.4",   # 带 tools 的请求会导入 MCP 模块，缺了 mcp 包所有工具调用都会失败
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "json-repair",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.uv]
package = false
# litellm 声明 filelock<4.0，但 3.x 有已知漏洞且只在 4.x 修复（4.2.1）。
# filelock 只被 huggingface_hub（FileLock / SoftFileLock / Timeout，4.x 仍兼容）和 litellm 的 proxy CLI（网关不用）引用，
# 所以强制升级；litellm 放开上限后删掉这一项。
override-dependencies = ["filelock>=4.2.1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["contract: 真实模型契约测试（需要 RUN_CONTRACT=1 和对应 Key）"]
